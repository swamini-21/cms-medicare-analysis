cms_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5433') | as_number }}"
      user: postgres
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: cms_project
      schema: analytics
      threads: 4
version: 2

models:
  - name: stg_cms__inpatient_provider
    description: >
      One row per hospital per year from the CMS Medicare Inpatient Hospitals
      by Provider data. Light cleanup only: renamed columns, casts to proper types.
    columns:
      - name: provider_ccn
        description: CMS Certification Number identifying the hospital.
        data_tests:
          - not_null
      - name: year
        description: Reporting year of the CMS file.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023, 2024]
      - name: provider_state
        description: Two-letter state abbreviation of the hospital.
        data_tests:
          - not_null
